<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSS 新闻 · dsh-rss-news-daily</title>
<link rel="stylesheet" href="web/style.css">
</head>
<body>
<header>
  <div class="tabs">
    <button class="tab active" data-tab="items">📰 全部新闻</button>
    <button class="tab" data-tab="digest">📋 今日精选</button>
    <button class="tab" data-tab="sources">🔌 订阅源</button>
    <button class="tab" data-tab="prefs">⚙ 设置</button>
  </div>
  <div class="statusbar" id="statusbar">加载中…</div>
</header>

<main>
  <!-- 全部条目流 -->
  <section id="tab-items">
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索标题/摘要…">
      <input type="date" id="day">
      <select id="category"><option value="">全部分类</option></select>
      <select id="srcFilter"><option value="">全部源</option></select>
      <label><input type="checkbox" id="unread"> 只看未读</label>
      <button id="btnFetch" title="立即抓取全部源">⟳ 抓取</button>
    </div>
    <div id="itemList" class="itemlist"></div>
    <div class="pager"><button id="prevPage">‹ 上一页</button><span id="pageInfo"></span><button id="nextPage">下一页 ›</button></div>
  </section>

  <!-- 今日精选日报 -->
  <section id="tab-digest" hidden>
    <div class="toolbar">
      <input type="date" id="digestDay" title="查看历史日报（生成始终针对今天）">
      <button id="btnDigestRun" title="立即生成今日日报">▶ 生成日报</button>
      <button id="btnDigestStop" hidden title="中止当前生成">⏹ 停止</button>
      <span id="digestBusy" class="busybar" hidden>⏳ 日报生成中…</span>
    </div>
    <article id="digestView" class="digest"></article>
  </section>

  <!-- 订阅源管理 -->
  <section id="tab-sources" hidden>
    <div class="toolbar">
      <input type="url" id="newSrcUrl" placeholder="https://…/feed.xml">
      <input type="text" id="newSrcTitle" placeholder="名称（可选）">
      <select id="newSrcCat">
        <option value="">分类…</option>
        <option>AI</option><option>科技</option><option>开发</option><option>开源</option>
        <option>产品</option><option>商业</option><option>财经</option><option>国际</option>
        <option>科学</option><option>健康</option><option>环境</option><option>社会</option>
        <option>人文</option><option>独立博客</option>
      </select>
      <button id="btnAddSrc">＋ 添加</button>
      <button id="btnRetryAll" title="并发重试全部失败/冷却源">↻ 重试全部失败源</button>
      <button id="btnOpmlExport">⇩ 导出 OPML</button>
      <label class="filebtn">⇧ 导入 OPML<input type="file" id="opmlFile" accept=".opml,.xml" hidden></label>
    </div>
    <div id="srcList" class="srclist"></div>
  </section>

  <!-- 偏好调教 -->
  <section id="tab-prefs" hidden>
    <div class="toolbar"><input type="text" id="tuneText" placeholder="例：多推 AI Agent、少推币圈、屏蔽裁员"><button id="btnTune">应用调教</button><button id="btnResetPrefs">↺ 重置</button></div>
    <div id="tuneResult"></div>
    <h3>定时调度</h3>
    <div class="sched-group"><span class="sched-label">生成日报</span><div id="schedDigestRows"></div></div>
    <div class="sched-group"><span class="sched-label">更新数据</span><div id="schedFetchRows"></div></div>
    <div class="toolbar">
      <button id="btnSchedSave">保存</button>
      <button id="btnSchedClear">恢复配置</button>
    </div>
    <div id="schedInfo" class="hist"></div>
    <h3>全局代理</h3>
    <div class="toolbar">
      <input type="text" id="proxyUrl" placeholder="http://127.0.0.1:7890（留空=跟随环境变量）">
      <button id="btnProxySave">保存</button>
    </div>
    <h3>连通测试</h3>
    <div class="toolbar">
      <input type="text" id="testUrl" placeholder="https://ip.zhuikan.com" value="https://ip.zhuikan.com">
      <label><input type="checkbox" id="testProxy"> 走代理</label>
      <button id="btnFetchTest">测试</button>
    </div>
    <pre id="fetchTestOut" class="hist" hidden></pre>
    <h3>日报模型</h3>
    <div class="toolbar">
      <select id="llmProvider"><option value="">provider…</option></select>
      <select id="llmModel"><option value="">model…</option></select>
      <button id="btnLlmSave">保存</button>
      <button id="btnLlmClear">恢复自动路由</button>
    </div>
    <div id="llmInfo" class="hist"></div>
    <h3>当前权重</h3>
    <div id="prefsView"></div>
  </section>
</main>

<script src="web/app.js"></script>
</body>
</html>
